name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend
        run: npm ci

      - name: Installer assets
        run: |
          python -m pip install pillow
          python scripts/generate-installer-assets.py

      - name: Build
        run: npm run tauri build

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true

      - name: Push to itch.io
        if: ${{ secrets.ITCH_API_KEY && secrets.ITCH_GAME }}
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_GAME: ${{ secrets.ITCH_GAME }}
        run: |
          Invoke-WebRequest https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default -OutFile butler.zip
          Expand-Archive butler.zip -DestinationPath butler
          New-Item -ItemType Directory -Force -Path itch-dist | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe itch-dist/
          Copy-Item src-tauri/installer/.itch.toml itch-dist/
          ./butler/butler push itch-dist $env:ITCH_GAME:windows --userversion ${{ github.ref_name }}
